<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Error de pago')}"></head>
  <body>
    <main class="mp-main mp-main--angosto">
      <h1>No se pudo cobrar</h1>
      <p th:text="${mensaje}">Error</p>
      <p>La suscripción no se renovó.</p>
      <a
        th:if="${mascotaId != null}"
        th:href="@{/mascotas/{id}(id=${mascotaId})}"
        class="btn btn-primary"
        >Volver a la mascota</a
      >
      <a th:href="@{/home}" class="btn btn-secondary">Volver</a>
    </main>
  </body>
</html>
