<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Mis turnos')}"></head>

  <body>
    <header
      th:replace="~{fragments/layout :: encabezado('Mis turnos', 'Consultá y administrá los turnos reservados en ' + ${veterinaria.nombre} + '.')}"
    ></header>

    <main role="main" class="mp-main">
      <div class="d-flex justify-content-start mb-3">
        <a class="btn btn-outline-primary" th:href="@{/veterinaria/inicio}"
          >Volver al Inicio</a
        >
      </div>
      <p
        th:if="${mensaje != null}"
        class="alert alert-success"
        th:text="${mensaje}"
      ></p>
      <p
        th:if="${error != null}"
        class="alert alert-danger"
        th:text="${error}"
      ></p>

      <section class="mp-card">
        <p th:if="${#lists.isEmpty(turnos)}" class="text-muted mb-0">
          Todavía no recibiste turnos.
        </p>
        <div class="table-responsive" th:unless="${#lists.isEmpty(turnos)}">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Fecha y hora</th>
                <th>Mascota</th>
                <th>Socio</th>
                <th>Servicio</th>
                <th>Estado</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="t : ${turnos}">
                <td
                  th:text="${#temporals.format(t.fecha, 'dd/MM/yyyy')} + ' ' + ${t.hora}"
                >
                  01/10/2026 10:00
                </td>
                <td>
                  <strong th:text="${t.mascota.nombre}">Mascota</strong>
                  <div class="small text-muted" th:text="${t.mascota.especie}">
                    Especie
                  </div>
                </td>
                <td>
                  <span
                    th:text="${t.mascota.socio.nombre} + ' ' + ${t.mascota.socio.apellido}"
                    >Socio</span
                  >
                  <div
                    class="small text-muted"
                    th:text="${t.mascota.socio.telefono}"
                  >
                    Teléfono
                  </div>
                </td>
                <td th:text="${t.servicio.nombre}">Servicio</td>
                <td>
                  <span
                    class="badge"
                    th:text="${t.estado}"
                    th:classappend="${t.estado.name() == 'CONFIRMADO'} ? 'text-bg-success' : (${t.estado.name() == 'FINALIZADO'} ? 'text-bg-info' : 'text-bg-secondary')"
                    >CONFIRMADO</span
                  >
                </td>
                <td class="text-end">
                  <div
                    class="d-flex flex-nowrap justify-content-end align-items-center gap-2"
                  >
                    <a
                      class="btn btn-outline-secondary btn-sm mp-btn-icono"
                      th:unless="${t.estado.name() == 'CANCELADO'}"
                      th:href="@{/veterinaria/turnos/{id}/medicacion(id=${t.id})}"
                      title="Ver medicación"
                      aria-label="Ver medicación"
                    >
                      <i class="bi bi-capsule" aria-hidden="true"></i>
                    </a>
                    <a
                      class="btn btn-outline-secondary btn-sm mp-btn-icono"
                      th:unless="${t.estado.name() == 'CANCELADO'}"
                      th:href="@{/veterinaria/turnos/{id}/historial(id=${t.id})}"
                      title="Ver historial clínico"
                      aria-label="Ver historial clínico"
                    >
                      <i class="bi bi-journal-medical" aria-hidden="true"></i>
                    </a>
                    <th:block th:if="${t.estaConfirmado()}">
                      <a
                        class="btn btn-outline-primary btn-sm"
                        th:href="@{/veterinaria/turnos/{id}/reprogramar(id=${t.id})}"
                        >Reprogramar</a
                      >
                      <form
                        th:action="@{/veterinaria/turnos/{id}/cancelar(id=${t.id})}"
                        method="POST"
                        onsubmit="
                          return confirm(
                            '¿Seguro que querés cancelar este turno?',
                          );
                        "
                      >
                        <button
                          class="btn btn-outline-danger btn-sm"
                          type="submit"
                        >
                          Cancelar
                        </button>
                      </form>
                      <a
                        class="btn btn-primary btn-sm"
                        th:href="@{/veterinaria/turnos/{id}/finalizar(id=${t.id})}"
                      >
                        <i class="bi bi-check2-circle" aria-hidden="true"></i>
                        Finalizar consulta
                      </a>
                      <form
                        th:action="@{/veterinaria/turnos/{id}/atendido(id=${t.id})}"
                        method="POST"
                        onsubmit="
                          return confirm('¿Marcar este turno como atendido?');
                        "
                      >
                        <button class="btn btn-success btn-sm" type="submit">
                          Marcar atendido
                        </button>
                      </form>
                    </th:block>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer th:replace="~{fragments/layout :: pie}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  </body>
</html>
